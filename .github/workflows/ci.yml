name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check public repository boundary
        run: python scripts/check_public_repo.py

      - name: Fresh editable install
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
