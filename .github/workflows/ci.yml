name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Check public repository boundary
        run: python scripts/check_public_repo.py

      - name: Fresh editable install
        run: python -m pip install -e ".[test]"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Test GUI rendering
        run: node --test tests/gui.test.js
