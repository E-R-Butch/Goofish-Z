name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Check public repository boundary
        run: python scripts/check_public_repo.py

      - name: Fresh editable install
        run: python -m pip install -e ".[test]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test GUI rendering
        run: node --test tests/gui.test.js

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test request contracts and build debug APK
        working-directory: app-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
