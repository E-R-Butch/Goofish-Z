<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goofish-Z · 闲鱼监控台</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1d24; --border:#2a2e37; --text:#e6e8eb; --dim:#8b919c; --accent:#4da3ff; --good:#3ddc84; --warn:#ffb454; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC",sans-serif; padding:24px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; flex:1; min-width:min(100%,320px); }
  .card h3 { font-size:14px; color:var(--dim); margin-bottom:12px; font-weight:500; }
  input, button { background:#232733; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:8px 12px; font-size:13px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#0b0e12; font-weight:600; }
  button:hover { filter:brightness(1.1); }
  .watch-item { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .watch-item:last-child { border-bottom:none; }
  .price { color:var(--good); font-weight:600; }
  .price.high { color:var(--warn); }
  .tag { background:#232733; border-radius:4px; padding:2px 8px; font-size:11px; color:var(--dim); }
  .alert { border-left:3px solid var(--warn); padding:8px 12px; margin:6px 0; background:#23273333; font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { text-align:left; white-space:nowrap; color:var(--dim); font-weight:500; padding:8px; border-bottom:1px solid var(--border); }
  td { padding:8px; border-bottom:1px solid #22262f; }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--dim); }
  .status { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--good); margin-right:6px; }
  .status.err { background:var(--warn); }
  button:disabled { opacity:.55; cursor:wait; }
  input { min-width:0; }
  td, .watch-item { overflow-wrap:anywhere; }
  a { color:var(--text); text-decoration:none; }
</style>
</head>
<body>
  <h1>🐟 Goofish-Z · 闲鱼监控台</h1>
  <div class="sub"><span class="status" id="health"></span><span id="healthText">连接中...</span></div>

  <div class="row">
    <div class="card" style="flex:1.4">
      <h3>🔍 搜索</h3>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input id="searchQ" placeholder="关键词，如 DDR3 RECC 32G" style="flex:1">
        <button class="primary" id="searchButton">搜索</button>
      </div>
      <div id="searchResults" style="max-height:380px; overflow-y:auto;">
        <div class="sub">输入关键词开始搜索</div>
      </div>
    </div>

    <div class="card">
      <h3>📌 监控项</h3>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input id="watchQ" placeholder="监控关键词" style="flex:1">
        <input type="number" min="0" step="0.01" id="watchMax" placeholder="低价线¥" style="width:70px">
        <button class="primary" id="addWatchButton">添加</button>
      </div>
      <div id="watchError" role="alert"></div>
      <div id="watchList"></div>
      <div style="margin-top:12px;">
        <button id="runAllButton">▶ 立即检查全部</button>
        <button id="cancelJobButton" hidden>取消本轮</button>
        <button id="refreshJobButton">刷新进度</button>
        <div id="runResult" class="sub" style="margin-top:8px"></div>
      </div>
    </div>
  </div>

  <div class="row" style="margin-top:12px;">
    <div class="card">
      <h3>⚠️ 告警记录</h3>
      <div id="alerts"><div class="sub">暂无告警</div></div>
    </div>
  </div>

  <div class="card" style="margin-top:12px;">
    <h3>📈 价格历史 <span class="mono" id="histWatchLabel"></span></h3>
    <div id="history" style="max-height:300px; overflow-y:auto;"><div class="sub">选择监控项查看历史</div></div>
  </div>

<script src="/static/app.js" defer></script>
</body>
</html>
