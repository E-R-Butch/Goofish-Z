<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goofish-Z · 闲鱼监控台</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1d24; --border:#2a2e37; --text:#e6e8eb; --dim:#8b919c; --accent:#4da3ff; --good:#3ddc84; --warn:#ffb454; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC",sans-serif; padding:24px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; flex:1; min-width:min(100%,320px); }
  .card h3 { font-size:14px; color:var(--dim); margin-bottom:12px; font-weight:500; }
  input, button, select { background:#232733; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:8px 12px; font-size:13px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#0b0e12; font-weight:600; }
  button:hover { filter:brightness(1.1); }
  .watch-item { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .watch-item:last-child { border-bottom:none; }
  .price { color:var(--good); font-weight:600; white-space:nowrap; min-width:105px; }
  .price-source { color:var(--dim); font-size:10px; font-weight:400; margin-top:4px; }
  .price.high { color:var(--warn); }
  .tag { background:#232733; border-radius:4px; padding:2px 8px; font-size:11px; color:var(--dim); }
  .alert { border-left:3px solid var(--warn); padding:8px 12px; margin:6px 0; background:#23273333; font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { text-align:left; white-space:nowrap; color:var(--dim); font-weight:500; padding:8px; border-bottom:1px solid var(--border); }
  td { padding:8px; border-bottom:1px solid #22262f; }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--dim); }
  .status { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--good); margin-right:6px; }
  .status.err { background:var(--warn); }
  button:disabled { opacity:.55; cursor:wait; }
  input { min-width:0; }
  td, .watch-item { overflow-wrap:anywhere; }
  a { color:var(--text); text-decoration:none; }
  .filters { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:10px; }
  .filters label { display:flex; flex-direction:column; gap:4px; color:var(--dim); font-size:11px; min-width:0; }
  .filters input, .filters select { width:100%; }
  .filter-heading, .pagination { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .filter-heading .sub { margin:0; flex:1; }
  .pagination .sub { margin:0; }
  .search-table { max-height:520px; overflow:auto; }
  .search-table th { position:sticky; top:0; background:var(--panel); }
  .search-summary { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin:10px 0 16px; }
  .search-summary .sub { flex:1 1 280px; margin:0; line-height:1.6; }
  .filter-trash { flex-shrink:0; min-height:44px; white-space:nowrap; color:var(--warn); background:#ffb45414; border-color:#ffb45480; padding:10px 14px; font-size:15px; font-weight:600; }
  .filter-trash[aria-expanded="true"] { background:#ffb45426; border-color:var(--warn); }
  .filter-trash:focus-visible { outline:2px solid var(--warn); outline-offset:3px; }
  .filter-trash:disabled { cursor:default; }
  .filtered-details { padding:12px; margin-bottom:16px; border:1px solid var(--border); border-radius:6px; background:#14171d; }
  .filtered-details h4 { font-size:13px; color:var(--warn); margin-bottom:8px; }
  .filtered-item { padding:10px 0; border-bottom:1px solid var(--border); font-size:12px; overflow-wrap:anywhere; }
  .filtered-item:last-child { border-bottom:0; }
  .filtered-item-heading { display:flex; align-items:baseline; gap:10px; margin-bottom:5px; }
  .filtered-item-heading .price { min-width:0; flex-shrink:0; }
  .filtered-item-heading > :last-child { min-width:0; }
  .filtered-item ul { color:var(--warn); padding-left:18px; margin:6px 0 0; line-height:1.5; }
  @media(max-width:600px) { body { padding:12px; } .filters { grid-template-columns:repeat(2,minmax(0,1fr)); } }
</style>
</head>
<body>
  <h1>🐟 Goofish-Z · 闲鱼监控台</h1>
  <div class="sub"><span class="status" id="health"></span><span id="healthText">连接中...</span></div>

  <div class="row">
    <div class="card" style="flex:1.4">
      <h3>🔍 搜索</h3>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input id="searchQ" placeholder="关键词，如 DDR3 RECC 32G" style="flex:1">
        <button class="primary" id="searchButton">搜索</button>
      </div>
      <div class="filter-heading">
        <span class="sub">筛选当前页 · 即时生效</span>
        <button id="resetFiltersButton">清空筛选</button>
      </div>
      <div class="filters">
        <label>最低价（元）<input id="searchMin" type="number" min="0" step="0.01" placeholder="不限"></label>
        <label>最高价（元）<input id="searchMax" type="number" min="0" step="0.01" placeholder="不限"></label>
        <label>地区<input id="searchLocation" placeholder="如 上海"></label>
        <label>标题包含（全部匹配）<input id="searchInclude" placeholder="多个词用空格分隔"></label>
        <label>标题排除（任一匹配）<input id="searchExclude" placeholder="如 回收 配件"></label>
        <label>排序<select id="searchSort">
          <option value="default">闲鱼默认顺序</option>
          <option value="price_asc">价格从低到高</option>
          <option value="price_desc">价格从高到低</option>
        </select></label>
      </div>
      <div id="searchResults" class="search-table" aria-live="polite">
        <div class="sub">输入关键词开始搜索</div>
      </div>
      <div class="pagination">
        <button id="searchPrevButton" disabled>上一页</button>
        <span id="searchPageLabel" class="sub">每页最多 30 条</span>
        <button id="searchNextButton" disabled>下一页</button>
      </div>
    </div>

    <div class="card">
      <h3>📌 监控项</h3>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input id="watchQ" placeholder="监控关键词" style="flex:1">
        <input type="number" min="0" step="0.01" id="watchMax" placeholder="低价线¥" style="width:70px">
        <button class="primary" id="addWatchButton">添加</button>
      </div>
      <div id="watchError" role="alert"></div>
      <div id="watchList"></div>
      <div style="margin-top:12px;">
        <button id="runAllButton">▶ 立即检查全部</button>
        <button id="cancelJobButton" hidden>取消本轮</button>
        <button id="refreshJobButton">刷新进度</button>
        <div id="runResult" class="sub" style="margin-top:8px"></div>
      </div>
    </div>
  </div>

  <div class="row" style="margin-top:12px;">
    <div class="card">
      <h3>⚠️ 告警记录</h3>
      <div id="alerts"><div class="sub">暂无告警</div></div>
    </div>
  </div>

  <div class="card" style="margin-top:12px;">
    <h3>📈 价格历史 <span class="mono" id="histWatchLabel"></span></h3>
    <div id="history" style="max-height:300px; overflow-y:auto;"><div class="sub">选择监控项查看历史</div></div>
  </div>

<script src="/static/app.js" defer></script>
</body>
</html>
