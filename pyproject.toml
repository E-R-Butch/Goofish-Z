[project]
name = "goofish-z"
version = "0.2.0"
description = "闲鱼全功能整合包 — GUI + Agent 双驱动 (CLI/MCP/HTTP API)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "loguru>=0.7",
    "typer>=0.12",
    "pydantic>=2.6",
    "pyexecjs>=1.5",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "mcp>=2.1.1,<3",
    "websockets>=13",
    "browser-cookie3>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "playwright>=1.45",
    "filelock>=3.13",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
goofish-z = "goofish_z.cli:app"
goofish-z-mcp = "goofish_z.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goofish_z"]
