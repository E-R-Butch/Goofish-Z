[project]
name = "goofish-omni"
version = "0.1.0"
description = "闲鱼全功能整合包 — GUI + Agent 双驱动 (CLI/MCP/HTTP API)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "loguru>=0.7",
    "typer>=0.12",
    "pydantic>=2.6",
    "pyexecjs>=1.5",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "mcp>=1.2",
    "websockets>=13",
    "browser-cookie3>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
goofish-omni = "goofish_omni.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goofish_omni"]
